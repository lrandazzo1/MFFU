<style>
:root{
  --ink:#080a0e; --panel:#12161f; --panel-2:#181e2a;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --cyan:#00e0ff; --gold:#ffc400; --red:#ff2d55; --green:#39ff8c;
  --off:#c7cdd8; --dim:#7c8698;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
html{ scroll-behavior:smooth; }
body{
  background:var(--ink); color:#fff;
  font-family:'Oswald',system-ui,-apple-system,sans-serif; line-height:1.5;
  max-width:100%; overflow-x:hidden; -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.font-display{ font-family:'Anton',Impact,sans-serif; letter-spacing:.01em; }
.mono{ font-family:'JetBrains Mono',ui-monospace,monospace; }
a{ color:inherit; text-decoration:none; }
img{ max-width:100%; }

.wrap{ width:100%; max-width:960px; margin:0 auto; padding-left:22px; padding-right:22px; }

.topbar{
  position:sticky; top:0; z-index:40;
  background:rgba(8,10,14,.82); backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{ display:flex; align-items:center; gap:14px; height:60px; }
.brand{ display:flex; align-items:center; gap:10px; }
.brand-badge{
  font-family:'Anton',sans-serif; font-size:20px; color:var(--ink);
  background:var(--cyan); padding:3px 9px; border-radius:6px; line-height:1;
}
.brand-name{ font-family:'Anton',sans-serif; font-size:19px; letter-spacing:.02em; }
.brand-name span{ color:var(--cyan); }
.back-link{
  margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:12px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--dim);
  border:1px solid var(--line-2); border-radius:999px; padding:8px 15px;
  transition:color .12s ease, border-color .12s ease;
}
.back-link:hover{ color:var(--cyan); border-color:var(--cyan); }

.masthead{ position:relative; padding:56px 0 30px; overflow:hidden; }
.masthead::before{
  content:""; position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(1000px 460px at 82% -12%, rgba(0,224,255,.15), transparent 60%),
    radial-gradient(760px 360px at 4% 6%, rgba(255,45,85,.09), transparent 62%);
  pointer-events:none;
}
.masthead .wrap{ position:relative; z-index:1; }
.eyebrow{
  display:inline-flex; align-items:center; gap:9px;
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px;
  letter-spacing:.18em; text-transform:uppercase; color:var(--cyan);
  border:1px solid var(--line-2); border-radius:999px; padding:7px 14px;
  background:rgba(0,224,255,.05);
}
.masthead h1{
  font-family:'Anton',sans-serif; font-weight:400; line-height:1.02;
  font-size:clamp(38px,9vw,68px); margin:18px 0 12px; text-transform:uppercase;
}
.masthead h1 span{ color:var(--cyan); }
.masthead p{ color:var(--off); font-size:clamp(15px,2.4vw,18px); max-width:620px; }

.feed{ padding:14px 0 72px; display:grid; gap:18px; }

.card{
  position:relative; display:block;
  background:linear-gradient(180deg,var(--panel),var(--panel-2));
  border:1px solid var(--line); border-radius:16px; padding:22px 22px 20px;
  transition:transform .14s ease, border-color .14s ease, box-shadow .14s ease;
}
.card:hover{ transform:translateY(-2px); border-color:var(--line-2); box-shadow:0 18px 44px rgba(0,0,0,.42); }
.card-meta{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin-bottom:12px; }
.chip{
  font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink);
  background:var(--gold); padding:4px 10px; border-radius:6px;
}
.date{ font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.08em; color:var(--dim); text-transform:uppercase; }
.card h2{ font-family:'Anton',sans-serif; font-weight:400; font-size:clamp(22px,4.4vw,30px); line-height:1.08; margin-bottom:10px; text-transform:uppercase; }
.card:hover h2{ color:var(--cyan); }
.card p{ color:var(--off); font-size:15.5px; margin-bottom:16px; }
.card-foot{ display:flex; align-items:center; gap:12px; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.06em; color:var(--dim); }
.card-foot .rostered{ color:var(--green); }
.read{ margin-left:auto; color:var(--cyan); font-weight:700; letter-spacing:.1em; text-transform:uppercase; }

.state{
  text-align:center; padding:60px 20px; border:1px dashed var(--line-2);
  border-radius:16px; color:var(--dim); background:rgba(255,255,255,.02);
}
.state strong{ display:block; color:#fff; font-family:'Anton',sans-serif; font-weight:400; font-size:22px; text-transform:uppercase; margin-bottom:8px; letter-spacing:.02em; }
.state.err strong{ color:var(--red); }

.skeleton{ height:150px; border-radius:16px; background:linear-gradient(90deg,var(--panel) 0%,var(--panel-2) 50%,var(--panel) 100%); background-size:200% 100%; animation:sheen 1.3s linear infinite; }
@keyframes sheen{ 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

footer{ border-top:1px solid var(--line); padding:26px 0 40px; }
footer .wrap{ display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; color:var(--dim); font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.06em; }
footer a:hover{ color:var(--cyan); }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/">
      <span class="brand-badge">FSN</span>
      <span class="brand-name">Fantasy<span>Sports</span>Network</span>
    </a>
  </div>
</header>

<section class="masthead">
  <div class="wrap">
    <span class="eyebrow"><span class="mono">The Desk</span></span>
    <h1>FSN <span>Blog</span></h1>
    <p>Waiver reads, trade analysis, and matchup breakdowns. Every story maps the players it names to your active league rosters.</p>
  </div>
</section>

<main class="wrap">
  <div class="feed" id="feed" aria-live="polite">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>FSN Blog</span>
    <a href="/">Home</a>
    <a href="/blog">Blog</a>
    <span style="margin-left:auto">Fantasy Sports Network</span>
  </div>
</footer>

<script>
(function(){
  'use strict';
  var feed = document.getElementById('feed');

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function fmtDate(iso){
    try{
      var d = new Date(iso + 'T00:00:00');
      if (isNaN(d.getTime())) return esc(iso);
      return d.toLocaleDateString('en-US',{ month:'short', day:'numeric', year:'numeric' });
    }catch(e){ return esc(iso); }
  }

  function renderEmpty(){
    feed.innerHTML =
      '<div class="state"><strong>No stories yet</strong>' +
      'The desk is quiet. New articles land here as soon as they publish.</div>';
  }
  function renderError(err){
    console.error('[Blog] index feed failed to load', err);
    feed.innerHTML =
      '<div class="state err"><strong>The feed did not load</strong>' +
      'We could not reach the story index. Refresh in a moment, or open the app.</div>';
  }

  function card(post){
    var slug = esc(post.slug);
    var rostered = post.entityCount > 0
      ? '<span class="rostered">' + post.entityCount + ' player' + (post.entityCount === 1 ? '' : 's') + ' tracked</span>'
      : '<span>Feature</span>';
    return '<a class="card" href="/blog/' + slug + '">' +
        '<div class="card-meta">' +
          '<span class="chip">' + esc(post.category) + '</span>' +
          '<span class="date">' + fmtDate(post.publishDate) + '</span>' +
        '</div>' +
        '<h2>' + esc(post.title) + '</h2>' +
        '<p>' + esc(post.excerpt) + '</p>' +
        '<div class="card-foot">' +
          '<span>' + esc(post.author || 'FSN Desk') + '</span>' +
          rostered +
          '<span class="read">Read &rsaquo;</span>' +
        '</div>' +
      '</a>';
  }

  fetch('/content/generated/blog/index.json', { cache: 'no-cache' })
    .then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(data){
      var posts = (data && Array.isArray(data.posts)) ? data.posts : [];
      if (!posts.length){ renderEmpty(); return; }
      feed.innerHTML = posts.map(card).join('');
    })
    .catch(renderError);
})();
</script>
</body>
</html>
