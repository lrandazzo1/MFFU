<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FSN Blog</title>
<meta name="description" content="An FSN Blog story.">
<meta name="theme-color" content="#080a0e">
<meta property="og:type" content="article">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=&#39;http://www.w3.org/2000/svg&#39; viewBox=&#39;0 0 64 64&#39;%3E%3Crect width=&#39;64&#39; height=&#39;64&#39; fill=&#39;%23080a0e&#39;/%3E%3Ctext x=&#39;32&#39; y=&#39;43&#39; font-family=&#39;Helvetica,Arial&#39; font-size=&#39;27&#39; font-weight=&#39;bold&#39; fill=&#39;%2300e0ff&#39; text-anchor=&#39;middle&#39;%3EFSN%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#080a0e; --panel:#12161f; --panel-2:#181e2a;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --cyan:#00e0ff; --gold:#ffc400; --red:#ff2d55; --green:#39ff8c;
  --off:#c7cdd8; --dim:#7c8698;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
html{ scroll-behavior:smooth; }
body{
  background:var(--ink); color:#fff;
  font-family:'Oswald',system-ui,-apple-system,sans-serif; line-height:1.5;
  max-width:100%; overflow-x:hidden; -webkit-font-smoothing:antialiased; min-height:100vh;
}
.font-display{ font-family:'Anton',Impact,sans-serif; }
.mono{ font-family:'JetBrains Mono',ui-monospace,monospace; }
a{ color:inherit; text-decoration:none; }
img{ max-width:100%; }

.wrap{ width:100%; max-width:760px; margin:0 auto; padding-left:22px; padding-right:22px; }

.topbar{
  position:sticky; top:0; z-index:40;
  background:rgba(8,10,14,.82); backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{ display:flex; align-items:center; gap:14px; height:60px; max-width:760px; margin:0 auto; padding:0 22px; }
.brand{ display:flex; align-items:center; gap:10px; }
.brand-badge{ font-family:'Anton',sans-serif; font-size:20px; color:var(--ink); background:var(--cyan); padding:3px 9px; border-radius:6px; line-height:1; }
.brand-name{ font-family:'Anton',sans-serif; font-size:19px; letter-spacing:.02em; }
.brand-name span{ color:var(--cyan); }
.back-link{
  margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:12px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--dim);
  border:1px solid var(--line-2); border-radius:999px; padding:8px 15px;
  transition:color .12s ease, border-color .12s ease;
}
.back-link:hover{ color:var(--cyan); border-color:var(--cyan); }

article{ padding:44px 0 40px; }
.art-meta{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin-bottom:18px; }
.chip{ font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink); background:var(--gold); padding:4px 10px; border-radius:6px; }
.date{ font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.08em; color:var(--dim); text-transform:uppercase; }
h1.title{ font-family:'Anton',sans-serif; font-weight:400; line-height:1.04; font-size:clamp(32px,7vw,54px); text-transform:uppercase; margin-bottom:14px; }
.byline{ font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:.06em; color:var(--dim); border-bottom:1px solid var(--line); padding-bottom:22px; margin-bottom:26px; }
.byline b{ color:var(--off); font-weight:500; }

/* Body typography. Clauses break on periods, commas, colons: no em dashes. */
.body{ font-size:18px; color:#eef1f6; line-height:1.72; }
.body h2{ font-family:'Anton',sans-serif; font-weight:400; font-size:clamp(22px,4.6vw,30px); text-transform:uppercase; margin:34px 0 12px; color:#fff; }
.body h3{ font-family:'Oswald',sans-serif; font-weight:600; font-size:21px; margin:26px 0 10px; color:var(--cyan); letter-spacing:.01em; }
.body h4{ font-family:'Oswald',sans-serif; font-weight:600; font-size:18px; margin:22px 0 8px; color:#fff; }
.body p{ margin:0 0 18px; }
.body ul,.body ol{ margin:0 0 18px; padding-left:24px; }
.body li{ margin-bottom:8px; }
.body a{ color:var(--cyan); border-bottom:1px solid rgba(0,224,255,.35); }
.body a:hover{ border-bottom-color:var(--cyan); }
.body strong{ color:#fff; font-weight:600; }
.body code{ font-family:'JetBrains Mono',monospace; font-size:.86em; background:var(--panel-2); border:1px solid var(--line); border-radius:5px; padding:2px 6px; }
.body blockquote{
  margin:24px 0; padding:14px 20px; border-left:3px solid var(--cyan);
  background:rgba(0,224,255,.05); color:var(--off); font-size:18px;
}
.body hr{ border:0; border-top:1px solid var(--line); margin:30px 0; }

.entities{
  margin-top:38px; padding:22px; border:1px solid var(--line);
  border-radius:16px; background:linear-gradient(180deg,var(--panel),var(--panel-2));
}
.entities h4{ font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); margin-bottom:14px; }
.ent-list{ display:flex; flex-wrap:wrap; gap:10px; }
.ent{
  display:inline-flex; align-items:center; gap:9px;
  border:1px solid var(--line-2); border-radius:999px; padding:8px 14px;
  background:rgba(255,255,255,.02);
}
.ent .pos{ font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:800; letter-spacing:.08em; color:var(--ink); background:var(--cyan); padding:3px 7px; border-radius:5px; }
.ent .nm{ font-weight:500; font-size:15px; }
.ent .pid{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--dim); }

.more{ margin:36px 0 0; }
.more a{ font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--cyan); }

.state{ text-align:center; padding:70px 20px; border:1px dashed var(--line-2); border-radius:16px; color:var(--dim); background:rgba(255,255,255,.02); margin:40px 0; }
.state strong{ display:block; color:#fff; font-family:'Anton',sans-serif; font-weight:400; font-size:24px; text-transform:uppercase; margin-bottom:10px; letter-spacing:.02em; }
.state.err strong{ color:var(--red); }
.state a{ color:var(--cyan); }

.skeleton-line{ height:22px; border-radius:6px; margin:0 0 14px; background:linear-gradient(90deg,var(--panel) 0%,var(--panel-2) 50%,var(--panel) 100%); background-size:200% 100%; animation:sheen 1.3s linear infinite; }
.skeleton-line.title{ height:52px; width:80%; }
.skeleton-line.short{ width:60%; }
@keyframes sheen{ 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

footer{ border-top:1px solid var(--line); padding:26px 0 40px; }
footer .wrap{ display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; color:var(--dim); font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.06em; }
footer a:hover{ color:var(--cyan); }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">
      <span class="brand-badge">FSN</span>
      <span class="brand-name">Fantasy<span>Sports</span>Network</span>
    </a>
    <a class="back-link" href="/blog">All stories</a>
  </div>
</header>

<main class="wrap">
  <article id="article" aria-live="polite">
    <div class="skeleton-line short"></div>
    <div class="skeleton-line title"></div>
    <div class="skeleton-line"></div>
    <div class="skeleton-line"></div>
    <div class="skeleton-line short"></div>
  </article>
</main>

<footer>
  <div class="wrap">
    <span>FSN Blog</span>
    <a href="/">Home</a>
    <a href="https://app.fantasysportsnetwork.app/">App</a>
    <a href="/blog">Blog</a>
    <span style="margin-left:auto">Fantasy Sports Network</span>
  </div>
</footer>

<script>
(function(){
  'use strict';
  var mount = document.getElementById('article');

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function fmtDate(iso){
    try{
      var d = new Date(iso + 'T00:00:00');
      if (isNaN(d.getTime())) return esc(iso);
      return d.toLocaleDateString('en-US',{ month:'long', day:'numeric', year:'numeric' });
    }catch(e){ return esc(iso); }
  }

  // Slug from the clean URL /blog/<slug>, with a ?slug= fallback.
  function readSlug(){
    var m = window.location.pathname.match(/\/blog\/([^\/?#]+)\/?$/);
    if (m && m[1] && m[1] !== 'reader.html') return decodeURIComponent(m[1]);
    var qs = new URLSearchParams(window.location.search).get('slug');
    return qs ? qs.trim() : '';
  }

  function notFound(slug){
    console.warn('[Blog] article not found for slug: ' + slug);
    mount.innerHTML =
      '<div class="state"><strong>Story not found</strong>' +
      'We could not find that article. It may have moved. ' +
      '<a href="/blog">Back to all stories</a>.</div>';
    document.title = 'Story not found | FSN Blog';
  }
  function loadError(err, slug){
    console.error('[Blog] reader failed to load slug: ' + slug, err);
    mount.innerHTML =
      '<div class="state err"><strong>This story did not load</strong>' +
      'We could not reach the article. Refresh in a moment, or go ' +
      '<a href="/blog">back to all stories</a>.</div>';
  }

  function entityRow(e){
    var pos = e.position ? '<span class="pos">' + esc(e.position) + '</span>' : '';
    var pid = e.sleeperPlayerId ? '<span class="pid">#' + esc(e.sleeperPlayerId) + '</span>' : '';
    return '<span class="ent" data-sleeper-id="' + esc(e.sleeperPlayerId || '') + '">' +
      pos + '<span class="nm">' + esc(e.name) + '</span>' + pid + '</span>';
  }

  function render(post){
    var entities = Array.isArray(post.entities) ? post.entities : [];
    var entityBlock = entities.length
      ? '<div class="entities"><h4>Players in this story</h4><div class="ent-list">' +
          entities.map(entityRow).join('') + '</div></div>'
      : '';

    // bodyHtml is produced by the build pipeline from a fixed grammar. It is
    // static, deterministic, deploy-time output, not user input.
    mount.innerHTML =
      '<div class="art-meta">' +
        '<span class="chip">' + esc(post.category) + '</span>' +
        '<span class="date">' + fmtDate(post.publishDate) + '</span>' +
      '</div>' +
      '<h1 class="title">' + esc(post.title) + '</h1>' +
      '<div class="byline">By <b>' + esc(post.author || 'FSN Desk') + '</b></div>' +
      '<div class="body">' + (post.bodyHtml || '') + '</div>' +
      entityBlock +
      '<div class="more"><a href="/blog">&lsaquo; All stories</a></div>';

    document.title = post.title + ' | FSN Blog';
    var md = document.querySelector('meta[name="description"]');
    if (md && post.excerpt) md.setAttribute('content', post.excerpt);
  }

  var slug = readSlug();
  if (!slug){ notFound(''); return; }

  fetch('/content/generated/blog/posts/' + encodeURIComponent(slug) + '.json', { cache: 'no-cache' })
    .then(function(res){
      if (res.status === 404) { notFound(slug); return null; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(post){ if (post) render(post); })
    .catch(function(err){ loadError(err, slug); });
})();
</script>
</body>
</html>
