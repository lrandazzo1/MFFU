name: Apply 2026 Preseason Studio

on:
  push:
    paths:
      - 'scripts/apply_2026_preseason_studio.py'
      - 'scripts/fix_preseason_updater.py'
      - '.github/workflows/apply-2026-preseason-studio.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare targeted updater
        run: |
          python scripts/fix_preseason_updater.py
          python -m py_compile scripts/apply_2026_preseason_studio.py
      - name: Apply targeted updater
        run: python scripts/apply_2026_preseason_studio.py
      - name: Validate preserved features and new behavior
        run: |
          grep -Fq 'FSN STUDIO SHOW: 2026 PRESEASON PREVIEW & DRAFT AUDIT' index.html
          grep -Fq '2026 PRESEASON SPECIAL' index.html
          grep -Fq "NewsDesk.TOPICS.filter(t=> t.id !== 'studio')" index.html
          grep -Fq 'function getNewsFeedForWeek(season, week)' index.html
          grep -Fq 'function build2026PreseasonSpecial(week)' index.html
          grep -Fq "title:'All-Time Franchise Honor Roll'" index.html
          grep -Fq "title:'2026 Draft Report Card'" index.html
          grep -Fq "title:'Week 1 Tale of the Tape'" index.html
          grep -Fq "title:'Preseason FSN Power Index (1–12)'" index.html
          grep -Fq "info.id === 'preseason-2026'" index.html
          grep -Fq 'function renderVault' index.html
          grep -Fq 'playoffTierType' index.html
          grep -Fq 'id="writeStoryBtn"' index.html
          grep -Fq 'story-rail' index.html
          grep -Fq 'composeCommunity' index.html
      - name: Commit generated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add 2026 preseason Studio special'
          git push
