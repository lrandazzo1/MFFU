name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      require_signing:
        description: >-
          Fail the run if App Store Connect credentials are not usable
          (instead of building and skipping distribution).
        type: boolean
        default: false

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    env:
      # App Store Connect API key — used for distribution signing at export
      # (xcodebuild -allowProvisioningUpdates) and for the TestFlight upload.
      # The archive step does not need these; see the note on that step.
      APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
      APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_BUNDLE_ID: app.fantasysportsnetwork

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:ios

      # The native Capacitor iOS project (ios/App, Podfile, Xcode project) is
      # generated by the Capacitor CLI, not hand-written. Generate it in CI if
      # it is not present in the repo, otherwise just re-sync the web payload.
      # Either path installs CocoaPods dependencies as part of the sync.
      - name: Prepare native iOS project
        run: |
          if [ -d "ios/App" ]; then
            echo "Native iOS project present — syncing."
            npx cap sync ios
          else
            echo "Native iOS project missing — generating with 'cap add ios'."
            # 'cap add ios' refuses if any ios/ directory already exists
            # ("ios platform already exists"). The repo ships ios/HANDOFF.md
            # (a doc, not a generated project), so move ios/ aside, generate a
            # clean native project, then restore any non-generated files
            # without clobbering what Capacitor just created.
            if [ -d "ios" ]; then
              rm -rf "$RUNNER_TEMP/ios-preexisting"
              mv ios "$RUNNER_TEMP/ios-preexisting"
            fi
            npx cap add ios
            if [ -d "$RUNNER_TEMP/ios-preexisting" ]; then
              cp -Rn "$RUNNER_TEMP/ios-preexisting/." ios/ || true
            fi
            npx cap sync ios
          fi

      # Validate the App Store Connect credentials BEFORE spending 30 minutes
      # on an archive that cannot be exported. This normalizes and installs the
      # .p8, then asks App Store Connect directly whether it accepts the key,
      # so a credential problem is reported as a credential problem instead of
      # surfacing later as xcodebuild's misleading "No profiles for
      # 'app.fantasysportsnetwork' were found" / "No signing certificate
      # \"iOS Distribution\" found".
      #
      # It never fails the job on a push: an unusable key skips distribution
      # (see the `if:` guards below) so that a red run on main always means the
      # app itself broke. Run the workflow manually with require_signing = true
      # to make a credential problem fail loudly instead.
      - name: Preflight App Store Connect credentials
        id: signing
        env:
          APPSTORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
          APPSTORE_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPSTORE_CONNECT_KEY_ID }}.p8
          REQUIRE_SIGNING: ${{ inputs.require_signing }}
        run: node scripts/appstore-preflight.mjs

      - name: Archive app
        working-directory: ios/App
        run: |
          # Build the archive WITHOUT code signing. All signing is deferred to
          # the export step, which mints/uses the Apple Distribution certificate
          # and App Store provisioning profile via the App Store Connect API key
          # (-allowProvisioningUpdates). Signing here would resolve to a
          # *development* identity and fail on the runner's empty keychain
          # ("Revoke certificate … private key is not installed"); an unsigned
          # archive avoids that entirely and lets export do distribution signing.
          #
          # This step runs on every build regardless of credentials — it is the
          # step that actually compiles the app, so it is the CI signal that a
          # change to index.html or the Capacitor config broke the iOS binary.
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export IPA
        if: steps.signing.outputs.available == 'true'
        env:
          API_KEY_PATH: ${{ steps.signing.outputs.key_path }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_CONNECT_ISSUER_ID"

      - name: Locate exported IPA
        id: ipa
        if: steps.signing.outputs.available == 'true'
        run: |
          IPA_PATH="$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error title=Export produced no IPA::exportArchive reported success but no .ipa was written to $RUNNER_TEMP/export."
            exit 1
          fi
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        if: steps.signing.outputs.available == 'true'
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}

      - name: Upload IPA artifact
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FSN.ipa
          path: ${{ steps.ipa.outputs.path }}
          retention-days: 14

      # Without credentials there is no IPA, but the compiled app is still the
      # proof that this commit builds. Keep it so a run is never empty-handed.
      - name: Upload unsigned archive
        if: steps.signing.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FSN-unsigned.xcarchive
          path: ${{ runner.temp }}/App.xcarchive
          retention-days: 7

      - name: Report distribution status
        if: success() && steps.signing.outputs.available != 'true'
        # The headline carries text from App Store Connect's error body, so it
        # is passed through the environment rather than interpolated into the
        # script — a `${{ }}` substitution here would be shell-evaluated.
        env:
          SIGNING_CODE: ${{ steps.signing.outputs.code }}
          SIGNING_HEADLINE: ${{ steps.signing.outputs.headline }}
        run: |
          {
            echo "### TestFlight distribution skipped"
            echo
            echo "The app compiled and archived successfully, but it was not exported or"
            echo "uploaded because App Store Connect credentials are not usable"
            echo "(\`${SIGNING_CODE}\`)."
            echo
            echo "> ${SIGNING_HEADLINE}"
            echo
            echo "See the **Preflight App Store Connect credentials** step above for the"
            echo "specific remedy. Once the secrets are corrected, re-run this workflow with"
            echo "**Run workflow → require_signing = true** to verify them end to end."
          } >> "$GITHUB_STEP_SUMMARY"
