name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      require_signing:
        description: >-
          Fail the run if App Store Connect credentials are not usable
          (instead of building and skipping distribution).
        type: boolean
        default: false

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # macos-14 is deprecated and its newest Xcode is 15.x (iOS 17 SDK), which
    # App Store Connect no longer accepts. macos-15 ships Xcode 26.x alongside
    # the older ones; the exact one is pinned in the 'Select Xcode' step below.
    runs-on: macos-15
    timeout-minutes: 40

    env:
      # App Store Connect API key — used by Xcode for automatic cloud-managed
      # signing during both archive and export, and for the TestFlight upload.
      # No certificate or provisioning profile is imported into the runner.
      APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
      APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_BUNDLE_ID: app.fantasysportsnetwork

    steps:
      - uses: actions/checkout@v5

      # Apple requires every iOS upload to be built with the current SDK: since
      # 28 April 2026 that is the iOS 26 SDK, shipped in Xcode 26. A build made
      # with an older one is rejected at upload with
      #
      #   ITMS-90725: SDK version issue. This app was built with the iOS <n> SDK.
      #
      # which happens after a green 40-minute run, so it is worth pinning rather
      # than discovering. The runner image carries several Xcodes and its default
      # is still 16.4 (iOS 18 SDK), so the version is selected explicitly instead
      # of inherited. '26' resolves to the newest stable 26.x on the image; bump
      # the major here when Apple raises the requirement again.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      # Fail here, in ten seconds, rather than at the upload step 40 minutes
      # later, if the image ever stops carrying the SDK the App Store requires.
      - name: Verify iOS SDK
        env:
          REQUIRED_IOS_SDK_MAJOR: 26
        run: |
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK $SDK (Xcode at $(xcode-select -p))"
          if [ "${SDK%%.*}" -lt "$REQUIRED_IOS_SDK_MAJOR" ]; then
            echo "::error title=iOS SDK too old::Selected Xcode provides the iOS $SDK SDK, but App Store Connect requires iOS $REQUIRED_IOS_SDK_MAJOR or later (ITMS-90725). Raise xcode-version in the 'Select Xcode' step, or move to a runner image that ships it."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:ios

      # The native Capacitor iOS project (ios/App, Podfile, Xcode project) is
      # generated by the Capacitor CLI, not hand-written. Generate it in CI if
      # it is not present in the repo, otherwise just re-sync the web payload.
      # Either path installs CocoaPods dependencies as part of the sync.
      - name: Prepare native iOS project
        run: |
          if [ -d "ios/App" ]; then
            echo "Native iOS project present — syncing."
            npx cap sync ios
          else
            echo "Native iOS project missing — generating with 'cap add ios'."
            # 'cap add ios' refuses if any ios/ directory already exists
            # ("ios platform already exists"). The repo ships ios/HANDOFF.md
            # (a doc, not a generated project), so move ios/ aside, generate a
            # clean native project, then restore any non-generated files
            # without clobbering what Capacitor just created.
            if [ -d "ios" ]; then
              rm -rf "$RUNNER_TEMP/ios-preexisting"
              mv ios "$RUNNER_TEMP/ios-preexisting"
            fi
            npx cap add ios
            if [ -d "$RUNNER_TEMP/ios-preexisting" ]; then
              cp -Rn "$RUNNER_TEMP/ios-preexisting/." ios/ || true
            fi
            npx cap sync ios
          fi

      - name: Generate and verify FSN icon and launch assets
        run: npm run ios:assets

      # Capacitor 6 scaffolds the project at iOS 13.0, which App Store Connect
      # rejects with "ITMS-90068: ... the value provided for the key
      # MinimumOSVersion is not acceptable". MinimumOSVersion in the built
      # Info.plist comes from IPHONEOS_DEPLOYMENT_TARGET, so the fix is to raise
      # the deployment target — in the Xcode project and in the Podfile platform
      # line the pods inherit — before anything is compiled.
      #
      # Like the export-compliance step below, this cannot live in the repo:
      # ios/ holds only HANDOFF.md and the native project is regenerated on
      # every run, so it is re-applied here after the Capacitor sync.
      - name: Set minimum iOS version
        env:
          MIN_IOS_VERSION: '15.0'
        run: |
          node scripts/ios-min-os.mjs
          # The sync already resolved the pods against the old platform line, so
          # they have to be resolved again now that it reads 15.0.
          cd ios/App && pod install

      # Wire generated entitlements and APNs callbacks after sync. Release
      # configuration and the final exported signature must agree with AASA.
      - name: Wire up Universal Links
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FSN_REQUIRE_APPLINKS: '1'
        run: |
          node scripts/ios-associated-domains.mjs
          node scripts/check-applinks.mjs

      # Capacitor generates Info.plist from its own template, which does not
      # declare export compliance. Without ITSAppUsesNonExemptEncryption every
      # uploaded build stops in TestFlight as "Missing Compliance" and stays
      # invisible to testers until someone answers the encryption question by
      # hand in App Store Connect — the upload succeeds and the build still
      # never arrives.
      #
      # FSN uses HTTPS only, to reach ESPN, Supabase and its own Vercel API.
      # That is the standard exemption, so `false` is the accurate answer.
      #
      # This cannot live in the repo: ios/ holds only HANDOFF.md, so the
      # plist is regenerated by 'cap add ios' (or overwritten by 'cap sync')
      # on every run. It is applied here, after that step and before archive.
      - name: Declare export compliance
        run: |
          PLIST="ios/App/App/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "::error title=Info.plist missing::Expected $PLIST after the Capacitor sync, but it is not there. The archive would upload without an export-compliance declaration and stall in TestFlight."
            exit 1
          fi
          # Add on a fresh template; Set when a previous run already added it.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          echo "ITSAppUsesNonExemptEncryption = $(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$PLIST")"

      # Validate the App Store Connect credentials BEFORE spending 30 minutes
      # on an archive that cannot be signed. This normalizes and installs the
      # .p8, verifies that Apple accepts the key and that it can access signing
      # resources, then exposes the same key file to archive and export. Cloud
      # signing requires an Admin-capable App Store Connect API key.
      #
      # It never fails the job on a push: an unusable key skips distribution
      # (see the `if:` guards below) so that a red run on main always means the
      # app itself broke. Run the workflow manually with require_signing = true
      # to make a credential problem fail loudly instead.
      - name: Preflight App Store Connect credentials
        id: signing
        env:
          APPSTORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
          APPSTORE_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPSTORE_CONNECT_KEY_ID }}.p8
          REQUIRE_SIGNING: ${{ inputs.require_signing }}
        run: node scripts/appstore-preflight.mjs

      - name: Archive app with Xcode-managed signing
        if: steps.signing.outputs.available == 'true'
        working-directory: ios/App
        env:
          API_KEY_PATH: ${{ steps.signing.outputs.key_path }}
        run: |
          # The archive must be signed. Entitlements are part of the code
          # signature, so CODE_SIGNING_ALLOWED=NO followed by ad-hoc signing
          # cannot produce a valid App Store archive. Xcode authenticates with
          # the App Store Connect API key and dynamically manages the Apple
          # Distribution certificate and App Store provisioning profile.
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      # Preserve the compile-only CI signal when credentials are absent, but do
      # not manufacture an unsigned archive and never route it toward export.
      - name: Build app without signing
        if: steps.signing.outputs.available != 'true'
        working-directory: ios/App
        run: |
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/UnsignedDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      # The deployment target was raised before the build, but MinimumOSVersion
      # is written by Xcode into the *built* Info.plist, so this is the only
      # place it can actually be read back. Checking it here turns a rejected
      # upload (ITMS-90068, reported by email minutes after a green run) into a
      # failed step naming the value that was shipped.
      - name: Verify minimum OS version
        if: steps.signing.outputs.available == 'true'
        env:
          MIN_IOS_VERSION: '15.0'
        run: |
          APP="$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP" ]; then
            echo "::error title=No app in the archive::xcodebuild reported success but $RUNNER_TEMP/App.xcarchive/Products/Applications holds no .app bundle."
            exit 1
          fi
          MIN="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")"
          echo "MinimumOSVersion = $MIN ($(basename "$APP"))"
          if [ "${MIN%%.*}" -lt "${MIN_IOS_VERSION%%.*}" ]; then
            echo "::error title=MinimumOSVersion too low::The archive declares MinimumOSVersion $MIN, below the required $MIN_IOS_VERSION — App Store Connect would reject it with ITMS-90068. The 'Set minimum iOS version' step ran, so the Capacitor project regained a lower value. Check that ios/App was regenerated after the step ran."
            exit 1
          fi

      - name: Export IPA
        if: steps.signing.outputs.available == 'true'
        env:
          API_KEY_PATH: ${{ steps.signing.outputs.key_path }}
        run: |
          python3 scripts/generate-ios-export-options.py \
            "$RUNNER_TEMP/ExportOptions.plist" \
            "$APPLE_TEAM_ID"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_CONNECT_ISSUER_ID"

      - name: Locate exported IPA
        id: ipa
        if: steps.signing.outputs.available == 'true'
        run: |
          IPA_PATH="$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error title=Export produced no IPA::exportArchive reported success but no .ipa was written to $RUNNER_TEMP/export."
            exit 1
          fi
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify exported release assets and signed capabilities
        if: steps.signing.outputs.available == 'true'
        env:
          FSN_EXPORTED_IPA: ${{ steps.ipa.outputs.path }}
        run: python3 scripts/verify-ios-release.py "$FSN_EXPORTED_IPA"

      # api-private-key is the key the preflight normalized and validated, not
      # the raw secret. The preflight accepts a .p8 stored as a real PEM, with
      # escaped newlines, or as a bare base64 body, and repairs the latter two.
      # Passing the raw secret here meant those repaired shapes reached export
      # (which reads the normalized file) but not the upload, so a run could
      # sign and export successfully and then fail at the last step. The
      # preflight publishes the repaired PEM as APPSTORE_CONNECT_PRIVATE_KEY_PEM
      # and masks it, so both consumers now read the same key material.
      - name: Upload to TestFlight
        if: steps.signing.outputs.available == 'true'
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          app-type: ios
          issuer-id: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          api-private-key: ${{ env.APPSTORE_CONNECT_PRIVATE_KEY_PEM }}
          # Return once Apple has the binary; do not sit on the runner polling
          # for the processing result. Run 31 uploaded cleanly and then failed
          # anyway: the action polls the Builds endpoint with the bearer token
          # it minted at the start, and after ~13 minutes of backoff (60s, 120s,
          # 240s, 300s...) Apple rejected that aged token with 401
          # NOT_AUTHORIZED. The credential was fine -- the same key had already
          # passed the preflight and carried the upload -- so waiting longer
          # only guarantees the token is even more expired.
          #
          # Processing is asynchronous on Apple's side and routinely outlasts
          # any token, so the upload is the honest end of this job. It is also
          # the expensive one to get wrong: macOS runner minutes bill at 10x,
          # and run 31 burned 13 of them to reach a foregone 401.
          #
          # Disabling the wait also skips the action's post-processing metadata
          # push, which costs nothing here: export compliance is declared in
          # Info.plist by the step above, so it travels inside the binary, and
          # no release-notes input is set.
          wait-for-processing: 'false'

      - name: Upload IPA artifact
        if: always() && steps.ipa.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: FSN.ipa
          path: ${{ steps.ipa.outputs.path }}
          retention-days: 14

      # Without credentials there is no releasable archive, but keep the
      # compile-only product so the run still proves the native app builds.
      - name: Upload unsigned build
        if: steps.signing.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FSN-unsigned-build
          path: ${{ runner.temp }}/UnsignedDerivedData/Build/Products/Release-iphoneos/*.app
          retention-days: 7

      - name: Report distribution status
        if: success() && steps.signing.outputs.available != 'true'
        # The headline carries text from App Store Connect's error body, so it
        # is passed through the environment rather than interpolated into the
        # script — a `${{ }}` substitution here would be shell-evaluated.
        env:
          SIGNING_CODE: ${{ steps.signing.outputs.code }}
          SIGNING_HEADLINE: ${{ steps.signing.outputs.headline }}
        run: |
          {
            echo "### TestFlight distribution skipped"
            echo
            echo "The app compiled and archived successfully, but it was not exported or"
            echo "uploaded because App Store Connect credentials are not usable"
            echo "(\`${SIGNING_CODE}\`)."
            echo
            echo "> ${SIGNING_HEADLINE}"
            echo
            echo "See the **Preflight App Store Connect credentials** step above for the"
            echo "specific remedy. Once the secrets are corrected, re-run this workflow with"
            echo "**Run workflow → require_signing = true** to verify them end to end."
          } >> "$GITHUB_STEP_SUMMARY"
