name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    env:
      # App Store Connect API key — used for both automatic code signing
      # (xcodebuild -allowProvisioningUpdates) and the TestFlight upload.
      APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
      APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:ios

      # The native Capacitor iOS project (ios/App, Podfile, Xcode project) is
      # generated by the Capacitor CLI, not hand-written. Generate it in CI if
      # it is not present in the repo, otherwise just re-sync the web payload.
      # Either path installs CocoaPods dependencies as part of the sync.
      - name: Prepare native iOS project
        run: |
          if [ -d "ios/App" ]; then
            echo "Native iOS project present — syncing."
            npx cap sync ios
          else
            echo "Native iOS project missing — generating with 'cap add ios'."
            # 'cap add ios' refuses if any ios/ directory already exists
            # ("ios platform already exists"). The repo ships ios/HANDOFF.md
            # (a doc, not a generated project), so move ios/ aside, generate a
            # clean native project, then restore any non-generated files
            # without clobbering what Capacitor just created.
            if [ -d "ios" ]; then
              rm -rf "$RUNNER_TEMP/ios-preexisting"
              mv ios "$RUNNER_TEMP/ios-preexisting"
            fi
            npx cap add ios
            if [ -d "$RUNNER_TEMP/ios-preexisting" ]; then
              cp -Rn "$RUNNER_TEMP/ios-preexisting/." ios/ || true
            fi
            npx cap sync ios
          fi

      - name: Install App Store Connect API key
        env:
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8"

          # xcodebuild's CryptoKit PEM parser is strict: CRLF line endings, a
          # missing trailing newline, or a value stored as bare base64 all
          # produce "invalidPEMDocument". Normalize into a canonical PEM so the
          # step works regardless of how the secret was pasted/stored.
          CLEAN="$(printf '%s' "$API_PRIVATE_KEY" | tr -d '\r')"
          if printf '%s' "$CLEAN" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$CLEAN" > "$KEY_PATH"
          else
            {
              echo "-----BEGIN PRIVATE KEY-----"
              printf '%s' "$CLEAN" | tr -d '[:space:]' | fold -w 64
              echo "-----END PRIVATE KEY-----"
            } > "$KEY_PATH"
          fi

          # Fail early with a clear message rather than a cryptic xcodebuild error.
          if ! grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"; then
            echo "APPSTORE_CONNECT_PRIVATE_KEY did not yield a valid .p8 PEM." >&2
            exit 1
          fi
          echo "API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive app
        working-directory: ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_CONNECT_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_CONNECT_ISSUER_ID"

      - name: Locate exported IPA
        id: ipa
        run: |
          IPA_PATH="$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)"
          if [ -z "$IPA_PATH" ]; then
            echo "No .ipa produced by exportArchive." >&2
            exit 1
          fi
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FSN.ipa
          path: ${{ steps.ipa.outputs.path }}
