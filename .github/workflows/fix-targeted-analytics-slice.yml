name: Fix targeted analytics slice

on:
  push:
    branches:
      - fix/dynamic-matchup-previews-strip-faab

permissions:
  contents: write

jobs:
  fix-analytics-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dynamic-matchup-previews-strip-faab
      - name: Replace escape-sensitive analytics matchers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-matchup-faab-fix.mjs')
          s = p.read_text()
          start = s.index("index = replaceLiteral(index,\n  \"<div class=\\\\\\\"analytics-gem-meta truncate")
          end = s.index("\nindex = replaceLiteral(index,\n  \"${analyticsModel('06'", start)
          replacement = r'''const gemMetaStart = index.indexOf('<div class="analytics-gem-meta truncate">');
if(gemMetaStart < 0) throw new Error('PATCH_MISS: waiver gem metadata render');
const gemMetaEnd = index.indexOf('</div>', gemMetaStart) + '</div>'.length;
index = index.slice(0, gemMetaStart) + `<div class="analytics-gem-meta truncate">${esc(gem.team ? gem.team.name : 'Unknown team')} · Week ${gem.week || '—'} · completed add</div>` + index.slice(gemMetaEnd);
const gemValueStart = index.indexOf('<div class="analytics-gem-roi">', gemMetaStart);
if(gemValueStart < 0) throw new Error('PATCH_MISS: waiver gem value render');
const gemValueEnd = index.indexOf('</div>', gemValueStart) + '</div>'.length;
index = index.slice(0, gemValueStart) + `<div class="analytics-gem-roi">${analyticsValue(gem.points)}<span>POST-ADD PTS</span></div>` + index.slice(gemValueEnd);
'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
      - name: Commit repair and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-targeted-analytics-slice.yml
          git add scripts/apply-matchup-faab-fix.mjs .github/workflows/fix-targeted-analytics-slice.yml
          git commit -m "Use structural waiver analytics patching [analytics-slice-fix]"
          git push origin HEAD:fix/dynamic-matchup-previews-strip-faab
