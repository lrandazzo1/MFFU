name: Fix final waiver aliases

on:
  push:
    branches:
      - fix/dynamic-matchup-previews-strip-faab

permissions:
  contents: write

jobs:
  fix-aliases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dynamic-matchup-previews-strip-faab
      - name: Add final legacy alias replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-matchup-faab-fix.mjs')
          s = p.read_text()
          marker = "  [\"{ id:'waivers',  label:'Waivers',        icon:'💰' }\", \"{ id:'waivers',  label:'Waivers',        icon:'↻' }\"],\n"
          insert = marker + "  ['FAAB fallout, Thursday afternoon for the primer — and the stream is sorted', 'waiver fallout, Thursday afternoon for the primer — and the stream is sorted'],\n  [\"if(['faab','rage'].includes(kind)) return 'transactions';\", \"if(['rage'].includes(kind)) return 'transactions';\"],\n  [\"roast:'blowout', power:'power', faab:'waiver', rage:'waiver',\", \"roast:'blowout', power:'power', rage:'waiver',\"],\n"
          if marker not in s:
              raise SystemExit('literal replacement map anchor not found')
          p.write_text(s.replace(marker, insert, 1))
          PY
      - name: Commit repair and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-final-faab-aliases.yml
          git add scripts/apply-matchup-faab-fix.mjs .github/workflows/fix-final-faab-aliases.yml
          git commit -m "Remove final waiver financial aliases [alias-fix]"
          git push origin HEAD:fix/dynamic-matchup-previews-strip-faab
