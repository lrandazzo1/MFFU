name: Fix live fetch and Setup

on:
  push:
    paths:
      - '.github/workflows/fix-live-fetch-setup-2026.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index
        run: python .github/scripts/fix-live-fetch-setup-2026.py

      - name: Validate targeted behavior
        run: |
          grep -q "const currentYear = 2026;" index.html
          grep -q "const proxyUrl = '/api/espn?url=' + encodeURIComponent(liveUrl);" index.html
          grep -q "safeRun('desk', renderDesk" index.html
          grep -q "safeRun('matchups', renderMatchups" index.html
          grep -q "safeRun('recordbook', renderRecordBook" index.html
          grep -q "safeRun('news', renderNews" index.html
          grep -q 'id="historyUploadPanel"' index.html
          grep -q 'id="leagueIdInput"' index.html
          grep -q 'id="fetchBtn"' index.html
          grep -q 'FSN STUDIO SHOW: 2026 PRESEASON PREVIEW & DRAFT AUDIT' index.html
          ! grep -q '<h2>AI News Desk</h2>' index.html
          ! grep -q '<h2>Broadcast Audio</h2>' index.html
          ! grep -q '<h2>Install</h2>' index.html
          ! grep -q 'id="showUrlBtn"' index.html
          ! grep -q 'id="espnAuthDetails"' index.html
          ! grep -q "\$('resetBtn').addEventListener('click'" index.html

      - name: Syntax-check inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', html, flags=re.I)
          if not scripts:
            raise SystemExit('No inline scripts found')
          out = Path('/tmp/fsn-inline-scripts')
          out.mkdir(exist_ok=True)
          for i, body in enumerate(scripts, 1):
            (out / f'script-{i}.js').write_text(body, encoding='utf-8')
          print(f'Extracted {len(scripts)} inline script block(s)')
          PY
          for f in /tmp/fsn-inline-scripts/*.js; do node --check "$f"; done

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix live 2026 loading and simplify Setup'
          git push
