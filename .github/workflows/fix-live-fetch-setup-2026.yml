name: Fix live fetch and Setup

on:
  push:
    paths:
      - '.github/workflows/fix-live-fetch-setup-2026.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch current-season loading and Setup
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Validate targeted behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          forbidden = ['<h2>AI News Desk</h2>','<h2>Broadcast Audio</h2>','<h2>Install</h2>','id="showUrlBtn"','id="espnAuthDetails"']
          found = [x for x in forbidden if x in s]
          if found:
            raise SystemExit('Removed Setup controls still present: ' + repr(found))
          required = [
            'const currentYear = 2026;',
            "const proxyUrl = '/api/espn?url=' + encodeURIComponent(liveUrl);",
            'applyLiveLeaguePayload(league, liveData, currentYear)',
            "safeRun('desk', renderDesk",
            "safeRun('matchups', renderMatchups",
            "safeRun('recordbook', renderRecordBook",
            "safeRun('news', renderNews",
            'id="historyUploadPanel"',
            'id="leagueIdInput"',
            'id="fetchBtn"',
            'FSN STUDIO SHOW: 2026 PRESEASON PREVIEW & DRAFT AUDIT',
          ]
          missing = [x for x in required if x not in s]
          if missing:
            raise SystemExit('Required feature markers missing: ' + repr(missing))
          if "function hideHistoryBanner(){ $('historyBanner').classList.add('hidden'); }" in s:
            raise SystemExit('Unsafe historyBanner dereference remains')
          if "$('resetBtn').addEventListener('click'" in s:
            raise SystemExit('Orphaned resetBtn listener remains')
          print('Targeted behavior markers passed')
          PY

      - name: Syntax-check inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', html, flags=re.I)
          if not scripts:
            raise SystemExit('No inline scripts found')
          out = Path('/tmp/fsn-inline-scripts')
          out.mkdir(exist_ok=True)
          for i, body in enumerate(scripts, 1):
            (out / f'script-{i}.js').write_text(body, encoding='utf-8')
          print(f'Extracted {len(scripts)} inline script block(s)')
          PY
          for f in /tmp/fsn-inline-scripts/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix live 2026 loading and simplify Setup'
          git push
