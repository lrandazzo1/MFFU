# The Tuesday weekly podcast.
#
# One run a week, a POST to /api/cron/generate-weekly-podcast, which builds the
# four-segment Dan & Stu script for every active league that does not already
# have this week's episode, synthesizes it, uploads the MP3 to Supabase Storage
# and writes the `podcast_episodes` row every league member reads. The route is
# idempotent, so a retry or a double fire costs nothing and nobody's episode
# changes under them.
#
# ---- WHY GITHUB ACTIONS AND NOT vercel.json crons ----
#
# The same three reasons the league blog articles run here, from
# docs/blog-articles.md:
#   - Vercel cron jobs are always issued as GET; this schedule POSTs.
#   - Day-of-week schedules and more than a couple of cron jobs need a paid
#     Vercel plan.
#   - The project's two Hobby cron slots are already spent on the transaction
#     wire and the notification dispatch, and a third entry fails the deploy.
# The equivalent vercel.json block is written out in docs/PODCAST_STUDIO.md if
# you would rather run it there once the project is on a paid plan.
#
# ---- THE WEEK IT RECAPS ----
#
# The schedule sends no week. The route resolves the JUST COMPLETED week from
# the NFL scoreboard — the live week when its games are in the books, otherwise
# the week behind it — and refuses a week that is still being played with a 409.
# A 409 is a skip here, not a failure.
#
# ---- THE OPTIONAL WEEK PIN ----
#
# PODCAST_TARGET_WEEK is unset in the Vercel project, and unset means "recap
# whatever week just ended". Setting it to a week number pins every run to that
# one week and answers 409 for the rest, before the route reaches ESPN,
# Supabase or ElevenLabs — a rehearsal lever. It defaulted to week 2 while the
# pipeline was being tested, which meant the schedule could only ever produce
# week 2; the completion gate above is the guard now.
#
# Required repository secret:
#   CRON_SECRET  — must equal the CRON_SECRET set in the Vercel project.
# Optional repository variable:
#   ARTICLE_CRON_BASE_URL — defaults to the production app domain.

name: Weekly podcast

on:
  schedule:
    # Tuesday 10:25 UTC (06:25 ET during the NFL season) — Tuesday morning, well
    # after the Monday night final. One run a week, and the only trigger that
    # mints an episode on its own: Studio's GENERATE button is locked from
    # Wednesday through Monday night while the week is still being played.
    #
    # ---- WHY 10:25 AND NOT 09:00 ----
    #
    # It used to be 09:00, one hour after the Tuesday article run at 08:00, and
    # that hour was the ONLY thing ordering the two. GitHub queues scheduled
    # workflows and starts them late under load, independently of each other, so
    # a one-hour nominal gap does not survive a busy morning: the podcast run
    # can and does start before the article run it reads from. Worse, minute 0
    # is the most contended minute of the hour — generate-editorial.yml moved
    # four of its own five schedules off it for exactly this reason — and BOTH
    # Tuesday jobs sat on it, so both were maximally likely to arrive late.
    #
    # Two changes. The nominal gap is now 145 minutes rather than 60, and this
    # run is off minute 0. Neither is a guarantee, which is why the `article-gate`
    # job below waits for the article run to actually finish before this one
    # POSTs anything. The schedule widens the odds; the gate is the contract.
    #
    # ---- WHY NOT EARLIER ON TUESDAY ----
    #
    # The default 'news' format narrates the `blog_articles` row for the league
    # week — the eight evaluated stat lines the Tuesday ARTICLE cron computes at
    # 08:00 UTC (.github/workflows/generate-articles.yml). No row, no payload,
    # and `readNewsPayload()` returns null, which the run treats as an ordinary
    # skip. A podcast run scheduled before 08:00 would therefore skip every
    # league, every week, and cost a whole week to notice. This schedule stays
    # AFTER the article one; scripts/podcast-segments-check.mjs asserts the
    # ordering so neither can be moved across the other by accident.
    #
    # The route does not trust the clock on its own. Before the league sweep it
    # asks the NFL scoreboard whether every game of the week it is about to
    # recap has finished, and answers 409 (reported below as a skip, not a
    # failure) if any has not — so a run that lands while the Monday night game
    # is still in overtime costs nothing and the next run picks the leagues up.
    # It also resolves WHICH week that is rather than assuming: the live week if
    # its box scores are closed, otherwise the week ESPN has just rolled off.
    # PODCAST_TARGET_WEEK is unset, so that resolution is the live path; setting
    # it to a week number pins every run to that week instead (still checked for
    # completion).
    - cron: '25 10 * * 2'
  workflow_dispatch:
    inputs:
      season:
        description: Season override. Leave blank for the current season.
        type: string
        required: false
      week:
        description: Week override. Leave blank for the week that just ended.
        type: string
        required: false
      # ---- SCOPE A MANUAL RUN TO ONE LEAGUE ----
      #
      # Blank is the sweep the Tuesday schedule runs: every active league that
      # has no episode for the week. That is right on a schedule and wrong for a
      # re-run, because it also generates — and publishes, and bills one
      # ElevenLabs call per dialogue turn for — every other league that happens
      # to be missing that week. Name a league id to touch that league only. An
      # id that is not active for the season is refused rather than run empty.
      league:
        description: League id to generate for. Leave blank to sweep every active league.
        type: string
        required: false
      # ---- ONE `choice`, NOT TWO BOOLEANS, AND IT DEFAULTS TO DRY ----
      #
      # A manual dispatch used to take `dry_run` and `script_only` as
      # `type: boolean` with `default: false`. Dispatching that through the REST
      # API with JSON *strings* ("true"/"false") rather than JSON booleans makes
      # GitHub discard the values and fall back to the declared defaults — so a
      # run asked for as a dry run arrived as DRY_RUN=0 and generated real
      # audio, billed ElevenLabs and wrote a real episode. That happened once.
      #
      # Two changes so it cannot happen again. `choice` values are strings, so
      # they survive an API dispatch intact. And the default is the SAFE mode:
      # a dropped, empty or unrecognised value now means "write nothing", while
      # spending money requires naming `live` explicitly. The Tuesday schedule
      # is forced to `live` in the env block below, so the fail-safe default
      # costs the real run nothing.
      mode:
        description: What this manual run should do.
        type: choice
        default: dry_run
        required: true
        options:
          - dry_run      # resolve leagues and idempotency, write nothing, spend nothing
          - script_only  # store the four segments, no audio, no ElevenLabs spend
          - live         # synthesize audio and spend at ElevenLabs
      # ---- REHEARSING BEFORE THE WEEK CLOSES ----
      #
      # The route refuses a week whose games are still being played. That is the
      # point of the schedule, and it also blocks a deliberate mid-week test, so
      # this lifts the check for one manual run. A `choice`, not a boolean, for
      # the reason spelled out above, and the default is the safe one. The
      # schedule never sets it.
      allow_open_week:
        description: Generate even though the week has not finished (rehearsal only).
        type: choice
        default: 'no'
        required: false
        options:
          - 'no'
          - 'yes'
      # ---- REPLACING AN EPISODE A LEAGUE ALREADY HAS ----
      #
      # The sweep skips any league that already holds a `podcast_episodes` row
      # for the week. That is what makes a retry free, and it is also what can
      # leave a league with no recap at all: on 2026-09-29 league 57155288 held
      # a `ready` week 3 row minted on the Sunday by the interactive Studio
      # path — an injury-wire preview of a week that had not been played — so
      # the Tuesday run reported it skipped and never recapped week 3.
      #
      # `force` lifts that skip. The route refuses it unless a week is also
      # named, so the schedule cannot reach it: the schedule sends no week.
      # `choice`, not `boolean`, and defaulting to 'no', for the same reason
      # `mode` is — see above.
      #
      # It spends: one ElevenLabs call per dialogue turn per league. Name a
      # league unless the whole sweep really is the intent, and rehearse with
      # mode=dry_run first.
      force:
        description: Regenerate over episodes that already exist. Requires a week.
        type: choice
        default: 'no'
        required: false
        options:
          - 'no'
          - 'yes'
      # ---- THE PER-RUN LEAGUE CEILING ----
      #
      # Blank leaves PODCAST_CRON_MAX_LEAGUES in force, which is 5 in the
      # deployment and sized for a schedule. There are 14 active leagues, so a
      # single sweep reaches five and reports the rest deferred — and on a
      # WEEKLY schedule "the next run picks them up" means next Tuesday, for a
      # different week. A catch-up has to be able to name its own ceiling.
      #
      # Note the route's own 50s budget still applies: over HTTP a large
      # ceiling reports the remainder as deferred rather than running longer.
      # The catch-up that finishes every league in one go is the runner-side
      # one, .github/workflows/force-weekly-podcast.yml.
      max_leagues:
        description: Per-run league ceiling. Blank uses PODCAST_CRON_MAX_LEAGUES.
        type: string
        required: false

permissions:
  contents: read
  # The article-gate job below reads THIS repository's own workflow runs to
  # confirm the Tuesday article run finished. Read-only, and nothing else in
  # this workflow needs it.
  actions: read

# A manual run must never race the scheduled one into the same league week.
# Two invocations would both pass the idempotency sweep and both claim.
concurrency:
  group: generate-weekly-podcast
  cancel-in-progress: false

jobs:
  # ---- THE DEPENDENCY GATE ----
  #
  # The default 'news' format narrates the `blog_articles` row the Tuesday
  # ARTICLE run writes. Until that row exists, readNewsPayload() finds either
  # nothing — and the league fails 422 — or the MONDAY row, which is a preview of
  # a week that had not been played. The second case is the dangerous one: the
  # run is green, the episode is wrong, and idempotency locks it in for the whole
  # week because the sweep skips any league that already holds a row.
  #
  # The schedule cannot prevent that on its own. GitHub queues scheduled
  # workflows and starts them late under load, independently per workflow, so
  # "the article run is at 08:00 and this one is at 10:25" orders nothing. This
  # job waits for the article run to actually reach `completed` before the
  # `record` job below is allowed to POST.
  #
  # It waits rather than failing fast, because a delayed article run is the
  # normal case this exists for and failing would cost the week an episode. It
  # proceeds on a FAILED article run, because that run exits non-zero when any
  # single league threw while still having written rows for the rest, and
  # blocking all fourteen leagues over one league's ESPN cookie would be the
  # worse outcome — the per-league 422 is recoverable on its own now.
  #
  # Only a manual dispatch skips the gate: a rehearsal, a dry run or a catch-up
  # names its own week and must not sit behind this morning's article run.
  article-gate:
    runs-on: ubuntu-latest
    # Comfortably over the poll budget below, so the timeout that reports is the
    # one with the explanatory message rather than the runner's bare one.
    timeout-minutes: 80
    outputs:
      conclusion: ${{ steps.wait.outputs.conclusion }}
    steps:
      - name: Wait for the Tuesday article run to finish
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          # How long to keep waiting for the article run to reach `completed`.
          # GitHub's scheduler is late by minutes on a normal morning and can be
          # late by tens of minutes under load; an hour of patience covers that
          # without letting a run that will never arrive hold a runner all day.
          WAIT_SECONDS: '3600'
          POLL_SECONDS: '60'
          # A scheduled article run older than this is last week's, or Monday's,
          # not the one this podcast run depends on. The Tuesday article run is
          # ~2h before this one, and Monday's is ~26h before, so any window
          # between those two separates them.
          LOOKBACK_HOURS: '12'
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" != "schedule" ]; then
            echo "::notice title=Gate skipped::A manual dispatch names its own week and does not wait on this morning's article run."
            echo "conclusion=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          api="https://api.github.com/repos/${REPO}/actions/workflows/generate-articles.yml/runs"
          deadline=$(( $(date -u +%s) + WAIT_SECONDS ))
          cutoff=$(( $(date -u +%s) - LOOKBACK_HOURS * 3600 ))

          while : ; do
            # Scheduled runs only. A workflow_dispatch backfill of an older week
            # says nothing about whether THIS morning's row was written.
            if ! curl -sS --fail-with-body \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              --max-time 30 \
              "${api}?event=schedule&per_page=10" -o runs.json; then
              # A transient API failure must not decide the morning either way.
              # Keep polling; the deadline below is what gives up.
              echo "::warning title=Could not read the article runs::The workflow-runs API did not answer. Retrying."
            else
              # Newest first is what the API returns, but sort on created_at
              # rather than trusting that, then keep only runs inside the window.
              latest=$(jq -c --argjson cutoff "$cutoff" '
                [ .workflow_runs[]
                  | select((.created_at | fromdateiso8601) >= $cutoff) ]
                | sort_by(.created_at) | last // empty
              ' runs.json)

              if [ -n "${latest:-}" ]; then
                status=$(printf '%s' "$latest" | jq -r '.status // ""')
                conclusion=$(printf '%s' "$latest" | jq -r '.conclusion // ""')
                url=$(printf '%s' "$latest" | jq -r '.html_url // ""')
                if [ "$status" = "completed" ]; then
                  echo "conclusion=${conclusion}" >> "$GITHUB_OUTPUT"
                  if [ "$conclusion" = "success" ]; then
                    echo "::notice title=Article run finished::$url"
                    echo "### Article run completed (success) — proceeding" >> "$GITHUB_STEP_SUMMARY"
                  else
                    # Not a stop. That run exits non-zero when ANY league threw,
                    # and the leagues it did write still deserve their episode.
                    echo "::warning title=Article run did not succeed::The Tuesday article run completed with '${conclusion}'. Proceeding: it exits non-zero when any single league fails, and the leagues it did write still need their episode. Leagues with no row will fail 422 and stay retryable. $url"
                    echo "### Article run completed (${conclusion}) — proceeding, expect 422s for leagues with no row" >> "$GITHUB_STEP_SUMMARY"
                  fi
                  exit 0
                fi
                echo "Article run ${url} is '${status}'. Waiting."
              else
                echo "No scheduled article run in the last ${LOOKBACK_HOURS}h yet. Waiting."
              fi
            fi

            if [ "$(date -u +%s)" -ge "$deadline" ]; then
              echo "::error title=Article run never finished::No scheduled generate-articles run reached 'completed' within $((WAIT_SECONDS / 60)) minutes. Nothing was requested, so no league was claimed and none is poisoned: re-dispatch this workflow with the week once the article run has finished."
              echo "### Gate timed out — no episode was attempted" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            sleep "${POLL_SECONDS}"
          done

  record:
    # The gate is the whole point: without `needs` this job races the article run
    # again and the schedule change above is cosmetic.
    needs: article-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate and publish
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ vars.ARTICLE_CRON_BASE_URL || 'https://app.fantasysportsnetwork.app' }}
          SEASON: ${{ inputs.season }}
          WEEK: ${{ inputs.week }}
          LEAGUE: ${{ inputs.league }}
          ALLOW_OPEN_WEEK: ${{ github.event_name == 'schedule' && 'no' || inputs.allow_open_week }}
          # The schedule never forces and never raises the ceiling. Both are
          # pinned here rather than left to the inputs, so a schedule cannot
          # inherit a value from anywhere.
          FORCE: ${{ github.event_name == 'schedule' && 'no' || inputs.force }}
          MAX_LEAGUES: ${{ github.event_name == 'schedule' && '' || inputs.max_leagues }}
          # The schedule carries no inputs, so it names its own mode. Any manual
          # run uses what was chosen, and the shell below treats anything it
          # does not recognise as a dry run.
          MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error title=CRON_SECRET missing::Set the CRON_SECRET repository secret to the value used in the Vercel project."
            exit 1
          fi

          # Fail safe: the wildcard is DRY. An empty or unexpected MODE writes
          # nothing and spends nothing rather than defaulting to a billable run.
          case "${MODE:-}" in
            live)        DRY_RUN=0; SCRIPT_ONLY=0 ;;
            script_only) DRY_RUN=0; SCRIPT_ONLY=1 ;;
            dry_run)     DRY_RUN=1; SCRIPT_ONLY=0 ;;
            *)
              echo "::warning title=Unrecognised mode::MODE='${MODE:-}' is not one of live, script_only, dry_run. Running as a dry run."
              DRY_RUN=1; SCRIPT_ONLY=0 ;;
          esac
          echo "mode=${MODE:-} -> dry_run=${DRY_RUN} script_only=${SCRIPT_ONLY}"

          # Anything but an explicit "yes" leaves the completion gate in force.
          [ "${ALLOW_OPEN_WEEK:-no}" = "yes" ] && OPEN_WEEK=1 || OPEN_WEEK=0

          # Same wildcard-is-safe rule as `mode`: only a literal "yes" forces.
          [ "${FORCE:-no}" = "yes" ] && FORCE_RUN=1 || FORCE_RUN=0

          # Caught here rather than by the route, so the run says which input
          # is wrong instead of reporting a 400 from a URL nobody can see.
          if [ "$FORCE_RUN" = "1" ] && [ -z "${WEEK:-}" ]; then
            echo "::error title=force needs a week::force=yes regenerates over episodes that already exist, so it requires the week input. Nothing was requested."
            exit 1
          fi
          if [ -n "${MAX_LEAGUES:-}" ] && ! echo "${MAX_LEAGUES}" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error title=max_leagues is not a number::max_leagues must be a positive whole number; got '${MAX_LEAGUES}'. Nothing was requested."
            exit 1
          fi

          url="${BASE_URL%/}/api/cron/generate-weekly-podcast?dry_run=${DRY_RUN}&script_only=${SCRIPT_ONLY}&allow_open_week=${OPEN_WEEK}&force=${FORCE_RUN}"
          [ -n "${SEASON:-}" ] && url="${url}&season=${SEASON}"
          [ -n "${WEEK:-}" ] && url="${url}&week=${WEEK}"
          [ -n "${LEAGUE:-}" ] && url="${url}&league=${LEAGUE}"
          [ -n "${MAX_LEAGUES:-}" ] && url="${url}&max_leagues=${MAX_LEAGUES}"

          # The secret travels as a header, never in the URL, so it stays out of
          # access logs and out of this job's own echoed command line.
          # --max-time is generous: synthesis is several provider round trips per
          # league, and the route caps itself at a 50s budget per invocation.
          status=$(curl -sS -X POST "$url" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H 'Content-Type: application/json' \
            --max-time 600 \
            -o response.json -w '%{http_code}')

          echo "HTTP $status"
          jq '.' response.json || cat response.json

          # 409 is a refusal to generate, not a failure: either the week boundary
          # declining a week it is not pinned to, or the completion gate saying
          # the week's box scores are not closed yet. Both are the guardrails
          # working, and the next run finds the same leagues with no episode.
          if [ "$status" = "409" ]; then
            reason=$(jq -r '.message // "week locked"' response.json)
            echo "::notice title=Week locked::$reason"
            echo "### Skipped: $reason" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$status" != "200" ]; then
            echo "::error title=Podcast run failed::The endpoint returned HTTP $status."
            exit 1
          fi

          # The route's own view of what it did. If this disagrees with the mode
          # that was asked for, the flag did not survive the trip and the run
          # may have spent money it was not meant to — say so loudly.
          reported_dry=$(jq -r '.dry_run // false' response.json)
          if [ "$DRY_RUN" = "1" ] && [ "$reported_dry" != "true" ]; then
            echo "::error title=Dry run was not honoured::A dry run was requested but the endpoint reported dry_run=$reported_dry. Treat this run as live and check podcast_episode_runs for spend."
            exit 1
          fi

          # A run asked to force that reports forced=false means the flag did not
          # survive the trip — the same class of failure as the dropped dry_run
          # above, and this one silently leaves the stale episodes in place.
          reported_force=$(jq -r '.forced // false' response.json)
          if [ "$FORCE_RUN" = "1" ] && [ "$reported_force" != "true" ]; then
            echo "::error title=Force was not honoured::A forced run was requested but the endpoint reported forced=$reported_force. The existing episodes were NOT replaced."
            exit 1
          fi

          created=$(jq -r '.created // 0' response.json)
          regenerated=$(jq -r '.regenerated // 0' response.json)
          skipped=$(jq -r '.skipped // 0' response.json)
          failed=$(jq -r '.failed // 0' response.json)
          deferred=$(jq -r '.not_attempted // 0' response.json)
          week=$(jq -r '.week // "?"' response.json)
          echo "created=$created skipped=$skipped failed=$failed deferred=$deferred"

          # A scoped run that reports a different league than the one asked for
          # would mean the filter did not survive the trip — the same class of
          # failure as the dropped dry_run flag above, and this one publishes
          # episodes to leagues that did not ask for them.
          if [ -n "${LEAGUE:-}" ]; then
            reported_league=$(jq -r '.league // ""' response.json)
            if [ "$reported_league" != "$LEAGUE" ]; then
              echo "::error title=League scope was not honoured::Asked for league ${LEAGUE} but the endpoint reported '${reported_league}'. Treat this run as a full sweep and check podcast_episode_runs."
              exit 1
            fi
          fi
          echo "### Week $week: $created created ($regenerated regenerated), $skipped skipped, $failed failed, $deferred deferred" >> "$GITHUB_STEP_SUMMARY"

          # A deferred league is not lost to a DAILY cron — the next run finds no
          # episode for it. This cron is weekly, so "next run" is seven days out
          # and recapping a different week: a deferred league gets no episode for
          # THIS week unless someone runs the catch-up. Say that, rather than
          # the reassuring version.
          if [ "$deferred" != "0" ]; then
            echo "::warning title=Leagues deferred::$deferred league(s) were over the per-run ceiling of $(jq -r '.max_leagues // "?"' response.json). The next SCHEDULED run recaps the following week, so week $week will stay missing for them until a catch-up run: .github/workflows/force-weekly-podcast.yml, or re-dispatch this workflow with week=$week and max_leagues set above the league count."
            echo "### $deferred league(s) deferred — week $week needs a catch-up run" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$failed" != "0" ]; then
            echo "::error title=Some leagues failed::$failed league(s) produced no episode. See podcast_episode_runs."
            exit 1
          fi
