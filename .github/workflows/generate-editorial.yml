# The public editorial generator, on autopilot.
#
# scripts/generate-editorial.mjs reads Sleeper's free public API. That API is
# unauthenticated, so this workflow needs no secret to do the interesting part,
# but it does need outbound network: the development container this repo is
# usually worked in denies api.sleeper.app at its egress proxy, so a run there
# reports "no verified source" and writes nothing. A GitHub runner can reach it.
# This is where the live path runs.
#
# A successful run publishes. It commits the generated source file together
# with the payload `npm run build:blog` compiled from it, and pushes to the
# branch the run started from, which for the schedule is the default branch.
# The landing deploy then serves the new article. The generated Markdown is
# also printed into the run summary and uploaded as an artifact either way, so
# a dispatch with `commit` off is a safe preview of exactly what a committing
# run would publish.
#
# The source file and the compiled payload are committed together on purpose.
# The payload is what /blog actually reads, it is source controlled because the
# landing project runs no build step, and `npm run check:blog` (first in
# `npm run verify`) fails on drift between the two. Committing one without the
# other would leave the default branch failing its own check.
#
# There is no "publish nothing" failure mode to worry about. If Sleeper is
# unreachable, reports an offseason week, or resolves to too few usable players
# for a board, the generator writes nothing and exits clean, the commit step
# finds an empty index and says so, and the run is green with no article. That
# is the designed outcome, not a failure to chase.
#
# Repository secrets (for the Supabase half):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# With either missing the generator says so and still writes the source file,
# so a repo that has not set them still publishes to /blog.

name: Public editorial generator

# The generator resolves the day's angle from the Eastern weekday, so the
# schedule is what decides which of the five stories actually gets written. Each
# cron below is placed inside the window its angle is about, in UTC, which is
# ET+4 while the season is on EDT:
#
#   Thu 20:47 UTC = 16:47 ET   four hours before the Thursday night kickoff.
#   Fri 13:47 UTC = 09:47 ET   the Thursday game is final, the weekend is not.
#   Sun 14:47 UTC = 10:47 ET   before the 13:00 ET window locks.
#   Mon 14:47 UTC = 10:47 ET   Sunday night is final, Monday night is not.
#   Tue 13:00 UTC = 09:00 ET   the week is closed, before the claim deadline.
#
# The four added days sit on minute 47 rather than minute 0: GitHub queues
# scheduled workflows and the top of the hour is the most contended minute of
# the hour, so a run placed there is the one most likely to arrive late, and
# these are time sensitive. Tuesday keeps minute 0, which it has always had; it
# is three hours after the league recap run in generate-articles.yml (Tuesday
# 08:00 UTC), so the two never contend for the same runner minute.
#
# A run on any other day, or a run whose angle cannot be supported by the live
# slate, writes the evergreen platform-wide add board instead. That is the
# generator's documented fallback, not a failure, so a mistimed or manual
# dispatch still publishes something true.
on:
  schedule:
    - cron: '47 20 * * 4'
    - cron: '47 13 * * 5'
    - cron: '47 14 * * 0'
    - cron: '47 14 * * 1'
    - cron: '0 13 * * 2'
  workflow_dispatch:
    inputs:
      mode:
        description: Source to read.
        type: choice
        options: [auto, sleeper, rss]
        default: sleeper
        required: true
      publish_supabase:
        description: Also upsert the global row into blog_articles (league_id null).
        type: boolean
        default: true
      commit:
        description: Commit and push the generated article and the compiled payload.
        type: boolean
        default: true
      angle:
        description: >-
          Force the day's angle instead of resolving it from the Eastern
          weekday. Use this to rehearse a day's output on any other day.
        type: choice
        options: ['', thursday, friday, sunday, monday, tuesday, midweek]
        default: ''
        required: false

# contents: write so a successful run can push the article it generated. The
# commit step is the only thing that needs it, and it runs after the blog build
# and its checks have both passed.
permissions:
  contents: write

concurrency:
  group: generate-editorial
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The generator itself is dependency free. build:blog is too. `npm ci`
      # is here only because the repo's other checks expect node_modules, and
      # it is cheap enough to keep the two steps in one job.
      - name: Install
        run: npm ci

      # A scheduled run carries no inputs at all, so every one of them needs a
      # fallback here rather than relying on the `default:` above, which only
      # applies to a dispatch. `github.event_name == 'schedule' ||` is the
      # autopilot default: on, unless a dispatch explicitly turned it off.
      - name: Resolve the run's settings
        id: settings
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SUPABASE: ${{ github.event_name == 'schedule' || inputs.publish_supabase }}
          INPUT_COMMIT: ${{ github.event_name == 'schedule' || inputs.commit }}
          # Empty on every scheduled run, which is what lets the generator
          # resolve the angle from the Eastern weekday itself.
          INPUT_ANGLE: ${{ inputs.angle }}
        run: |
          set -euo pipefail
          {
            echo "mode=${INPUT_MODE:-sleeper}"
            echo "publish_supabase=${INPUT_SUPABASE}"
            echo "commit=${INPUT_COMMIT}"
            echo "angle=${INPUT_ANGLE:-}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate from the live source
        env:
          MODE: ${{ steps.settings.outputs.mode }}
          PUBLISH_SUPABASE: ${{ steps.settings.outputs.publish_supabase }}
          ANGLE: ${{ steps.settings.outputs.angle }}
          # The generator reads these two names directly. They are always
          # passed; whether it uses them is decided by the flag below, so the
          # secret plumbing has one shape regardless of how the run started.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          args=(--mode "${MODE}")
          if [ "${PUBLISH_SUPABASE}" != "true" ]; then
            args+=(--no-supabase)
          fi
          if [ -n "${ANGLE:-}" ]; then
            args+=(--angle "${ANGLE}")
          fi
          node scripts/generate-editorial.mjs "${args[@]}"

      - name: Report what was written
        run: |
          set -euo pipefail
          # Anything the generator added or changed under the blog source tree.
          mapfile -t changed < <(git status --porcelain -- landing/content/blog | awk '{print $2}')
          if [ "${#changed[@]}" -eq 0 ]; then
            echo '### No article was written' >> "$GITHUB_STEP_SUMMARY"
            echo 'The generator found no verified source. That is its safe outcome, not a failure.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for file in "${changed[@]}"; do
            echo "### $file" >> "$GITHUB_STEP_SUMMARY"
            echo '```markdown' >> "$GITHUB_STEP_SUMMARY"
            cat "$file" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Compile and check the blog payload
        run: |
          set -euo pipefail
          npm run build:blog
          npm run check:blog

      # After the build and its checks, so a failing check can never produce a
      # commit.
      - name: Commit and push
        if: steps.settings.outputs.commit == 'true'
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The source file plus the payload it compiles into. check:blog fails
          # on drift between them, so they move together or not at all.
          git add -A -- landing/content/blog landing/content/generated/blog landing/blog landing/sitemap.xml
          if git diff --cached --quiet; then
            echo 'Nothing to commit: the generator found no verified source, or this article is already published.'
            echo '### Nothing to commit' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          slug=$(git diff --cached --name-only -- landing/content/blog \
            | grep -E '\.(md|mdx|json)$' \
            | head -n 1 | xargs -r basename | sed 's/\.[^.]*$//' || true)
          git commit -q \
            -m "Publish the generated editorial${slug:+: $slug}" \
            -m 'Written by .github/workflows/generate-editorial.yml from public sources. The compiled payload is committed alongside the source file because the landing project runs no build step and npm run check:blog fails on drift between the two.'

          # A concurrent push to the same branch is the one retryable failure
          # here. Rebase onto it and try again rather than forcing: a force
          # push from an unattended job is how somebody else's commit
          # disappears.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${REF}"; then
              echo "### Published to ${REF}" >> "$GITHUB_STEP_SUMMARY"
              git log -1 --format='%H %s' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "push attempt ${attempt} failed; rebasing onto origin/${REF} and retrying"
            git fetch origin "${REF}"
            git rebase "origin/${REF}"
            sleep $((attempt * 4))
          done
          echo "::error title=Push failed::Could not push the generated article to ${REF}."
          exit 1

      - name: Upload the generated source and payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-output
          if-no-files-found: warn
          path: |
            landing/content/blog/*.md
            landing/content/blog/*.json
            landing/content/generated/blog/**
