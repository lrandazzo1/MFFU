name: Validate Record Book migration

on:
  push:
    branches:
      - record-book-secure-ai
    paths:
      - .github/workflows/validate-record-book.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: record-book-secure-ai
          fetch-depth: 0

      - name: Check backend JavaScript syntax
        run: |
          node --check api/ai-news.js
          node --check api/tts.js

      - name: Check inline application JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.S|re.I)
          if not blocks:
              raise SystemExit('no inline script blocks found')
          for i, block in enumerate(blocks):
              Path(f'/tmp/fsn-inline-{i}.js').write_text(block)
          print(f'extracted {len(blocks)} inline scripts')
          PY
          for f in /tmp/fsn-inline-*.js; do node --check "$f"; done

      - name: Verify migration invariants
        run: |
          ! grep -qi "vault" index.html
          ! grep -q "api.openai.com/v1/chat/completions" index.html
          ! grep -q "api.elevenlabs.io/v1/text-to-speech" index.html
          ! grep -q "xi-api-key.*key" index.html
          grep -q "Backend AI Connected" index.html
          grep -q "function renderRecordBook" index.html
          grep -q "function renderDesk" index.html
          grep -q "fetch('/api/ai-news'" index.html
          grep -q "fetch('/api/tts'" index.html

      - name: Remove validation workflow and commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-record-book.yml
          git commit -m "Complete Record Book validation"
          git push origin HEAD:record-book-secure-ai
