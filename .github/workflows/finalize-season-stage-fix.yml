name: finalize-season-stage-fix

on:
  push:
    branches:
      - fix/automatic-season-stage-bylines

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/automatic-season-stage-bylines
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply staged implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/apply-season-stage-fix.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Apply minimal Block 6 fixes'
          start = lines.index(marker)
          run_line = next(i for i in range(start, len(lines)) if lines[i] == '        run: |')
          body = []
          for line in lines[run_line + 1:]:
              if line.startswith('      - name:') or line.startswith('      - uses:'):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
          if not body:
              raise SystemExit('could not extract staged patch body')
          Path('/tmp/apply-season-stage-fix.sh').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          bash /tmp/apply-season-stage-fix.sh

          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '''  const calendarWeek = nflRegularSeasonWeek(seasonYear, ref);
            const scheduleWeek = scheduleWeekFromPayload(d, seasonYear, ref);
            const completedWeek = completedSlateNextWeek(d, providerWeek);
            return Math.max(providerWeek, calendarWeek, scheduleWeek, completedWeek) || null;'''
          new = '''  const calendarWeek = nflRegularSeasonWeek(seasonYear, ref);
            const scheduleWeek = scheduleWeekFromPayload(d, seasonYear, ref);
            // Draft/preseason provider payloads occasionally expose a future scoring
            // period. Before either calendar or schedule authority opens Week 1, keep
            // the live head at Week 1 so the pregame board cannot jump ahead.
            if(calendarWeek === 0 && scheduleWeek === 0) return providerWeek ? 1 : null;
            const completedWeek = completedSlateNextWeek(d, providerWeek);
            return Math.max(providerWeek, calendarWeek, scheduleWeek, completedWeek) || null;'''
          if text.count(old) != 1:
              raise SystemExit('preseason live-head clamp: expected one match')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install dependencies and Chromium
        shell: bash
        run: |
          npm ci
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers"
          npx playwright install --with-deps chromium
      - name: Verify automatic season-stage fixtures
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const source = fs.readFileSync('index.html', 'utf8');

          function extractFunction(name){
            const start = source.indexOf('function ' + name + '(');
            assert.notEqual(start, -1, 'missing ' + name);
            const brace = source.indexOf('{', start);
            let depth = 0;
            for(let i = brace; i < source.length; i += 1){
              if(source[i] === '{') depth += 1;
              else if(source[i] === '}'){
                depth -= 1;
                if(depth === 0) return source.slice(start, i + 1);
              }
            }
            throw new Error('unterminated ' + name);
          }

          const context = {
            window: {
              EditorialScheduleEngine: {
                firstGameTimestamp(season, week, data){
                  return data && data.__kickoffs ? data.__kickoffs[week] || null : null;
                },
              },
            },
            Date,
            Number,
            Math,
            parseInt,
            console,
          };
          vm.createContext(context);
          vm.runInContext([
            extractFunction('nflRegularSeasonWeek'),
            extractFunction('scheduleWeekFromPayload'),
            extractFunction('completedSlateNextWeek'),
            extractFunction('deriveCurrentWeek'),
          ].join('\n'), context);

          const pre = new Date(2026, 8, 7, 23, 59, 59);
          const week1 = new Date(2026, 8, 8, 0, 0, 1);
          const week2 = new Date(2026, 8, 15, 0, 0, 1);
          assert.equal(context.nflRegularSeasonWeek(2026, pre), 0, 'preseason must remain stage 0 before Tuesday rollover');
          assert.equal(context.nflRegularSeasonWeek(2026, week1), 1, 'Tuesday rollover must open Week 1');
          assert.equal(context.nflRegularSeasonWeek(2026, week2), 2, 'next Tuesday rollover must open Week 2');

          const staleLive = {
            seasonId: 2026,
            scoringPeriodId: 1,
            status: { currentMatchupPeriod: 1, currentScoringPeriod: 1, isActive: true },
            schedule: [],
          };
          assert.equal(context.deriveCurrentWeek(staleLive, week2), 2, 'calendar fallback must advance a stale live provider to Week 2');

          const earlyProvider = {
            seasonId: 2026,
            scoringPeriodId: 3,
            status: { currentMatchupPeriod: 3, currentScoringPeriod: 3, isActive: true },
            schedule: [],
          };
          assert.equal(context.deriveCurrentWeek(earlyProvider, pre), 1, 'preseason provider drift must be clamped to Week 1');

          const historical = {
            seasonId: 2025,
            scoringPeriodId: 7,
            status: { currentMatchupPeriod: 7, currentScoringPeriod: 7, isActive: true },
            schedule: [],
          };
          assert.equal(context.deriveCurrentWeek(historical, week2), 7, 'historical seasons must stay pinned to provider week');

          const completed = {
            seasonId: 2026,
            scoringPeriodId: 1,
            status: { currentMatchupPeriod: 1, currentScoringPeriod: 1, isActive: true },
            schedule: [{ matchupPeriodId: 1, winner: 'HOME' }, { matchupPeriodId: 1, winner: 'AWAY' }],
            __kickoffs: { 2: new Date(2026, 8, 17, 19, 0, 0).getTime() },
          };
          assert.equal(context.completedSlateNextWeek(completed, 1), 2, 'finalized slate plus next kickoff must advance to the next week');
          console.log('[season-stage-fixture] preseason, weekly rollover, stale-provider, final-slate, and history checks passed');
          NODE
      - name: Verify scope, full UI render, and release browser
        shell: bash
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers"
          export FSN_CHROMIUM_PATH="$(node -e "const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())")"
          test -x "$FSN_CHROMIUM_PATH"
          npm run check:scope
          npm run check:render
          npm run check:release
      - name: Enforce byline and diff scope
        shell: bash
        run: |
          git restore www 2>/dev/null || true
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html "
          grep -q 'function syncAutomaticSeasonStage' index.html
          grep -q 'function scheduleWeekFromPayload' index.html
          grep -q 'function articleBylineAvatar' index.html
          grep -q 'articleBylineAvatar(a, 26)' index.html
          grep -q 'articleBylineAvatar(a, 30)' index.html
          grep -q 'articleBylineAvatar(a, 34)' index.html
      - name: Commit verified implementation and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-season-stage-fix.yml .github/workflows/verify-and-commit-season-stage-fix.yml .github/workflows/finalize-season-stage-fix.yml
          git add index.html
          git diff --cached --check
          git commit -m "fix: automate season transitions and FSN bylines"
          git push origin HEAD:fix/automatic-season-stage-bylines
