name: Finalize strict UI cleanup

on:
  push:
    branches:
      - strict-ui-config
    paths:
      - .github/workflows/strict-ui-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: strict-ui-config
          fetch-depth: 0

      - name: Remove remaining legacy AI shims
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          s = s.replace("/* ElevenLabs' stock library voices — a male read for the anchor, a female\n   read for the analyst. Both are overridable in Setup. */", "/* ElevenLabs stock voices are fixed application defaults. Speaker IDs are not editable in Setup. */")
          s = s.replace("  key: 'backend',\n", "")
          s = s.replace("    delete persisted.key;\n", "")
          s = s.replace("  try{ const persisted = Object.assign({}, prefs); delete persisted.key; localStorage.setItem(PREF_KEY, JSON.stringify(persisted)); }catch(e){}", "  try{ localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); }catch(e){}")
          s = s.replace("  Object.assign(prefs, { mode:'auto', sfx:true, bed:true, key:'backend', voiceHost:'', voiceAnalyst:'' });", "  Object.assign(prefs, { mode:'auto', sfx:true, bed:true });")
          s = re.sub(r"\n\s*const keyed = \(id, key\)=>\{.*?\n\s*keyed\('elevenVoiceAnalyst', 'voiceAnalyst'\);", "", s, flags=re.S)
          s = s.replace("</span> The Studio Show will use them while the key is saved.';", "</span> The Studio Show will use the secure backend voice service.';")
          s = s.replace("  /* Clearing saved data should take the key with it. */", "  /* Reset audio preferences without touching server-side credentials. */")
          p.write_text(s)
          PY

      - name: Validate strict invariants and syntax
        run: |
          node --check api/ai-news.js
          node --check api/tts.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.S|re.I)
          for i, block in enumerate(blocks):
              Path(f'/tmp/fsn-inline-{i}.js').write_text(block)
          PY
          for f in /tmp/fsn-inline-*.js; do node --check "$f"; done
          ! grep -Eqi 'chatbot|chat bot|ai assistant|assistant panel' index.html
          ! grep -qi 'vault' index.html
          ! grep -Eqi 'openaiKey|openaiReveal|elevenKey|elevenReveal|elevenVoiceHost|elevenVoiceAnalyst|voiceHost|voiceAnalyst|key: .backend.' index.html
          ! grep -q 'api.openai.com/v1/chat/completions' index.html
          ! grep -q 'api.elevenlabs.io/v1/text-to-speech' index.html
          grep -q 'Backend AI Connected' index.html
          grep -q "fetch('/api/ai-news'" index.html
          grep -q "fetch('/api/tts'" index.html
          grep -q 'function renderRecordBook' index.html
          grep -q 'function renderDesk' index.html

      - name: Commit final application cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove remaining AI configuration shims"
          git push origin HEAD:strict-ui-config

      - name: Remove finalizer
        run: |
          git rm .github/workflows/strict-ui-finalize.yml
          git commit -m "Complete strict UI finalization"
          git push origin HEAD:strict-ui-config
