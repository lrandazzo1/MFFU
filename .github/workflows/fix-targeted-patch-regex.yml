name: Fix targeted patch regex

on:
  push:
    branches:
      - fix/dynamic-matchup-previews-strip-faab

permissions:
  contents: write

jobs:
  fix-regex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dynamic-matchup-previews-strip-faab
      - name: Replace malformed waiver-gem patch regex
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-matchup-faab-fix.mjs')
          s = p.read_text()
          anchor = s.index('// Analytics: keep the useful "gem" idea')
          start = s.index('index = replaceOnce(index,', anchor)
          end = s.index('index = replaceOnce(index, /gems\\.sort', start)
          replacement = r'''index = replaceOnce(index,
            /      const bid = Math\.max\(0, number\(tx\.bid\)\);[\s\S]*?      \}\);/,
            `      gems.push({
                  id:String(tx.id) + ':' + String(add.playerId),
                  player:add.name || meta.name || ('Player ' + add.playerId),
                  pos,
                  team:FSNIntel.teamOf(tx.teamId),
                  week:fromWeek,
                  points,
                });`,
            'waiver gem financial fields');
          '''
          p.write_text(s[:start] + replacement + s[end:])
          PY
      - name: Commit repair and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-targeted-patch-regex.yml
          git add scripts/apply-matchup-faab-fix.mjs .github/workflows/fix-targeted-patch-regex.yml
          git commit -m "Fix targeted waiver-gem patch regex [regex-fix]"
          git push origin HEAD:fix/dynamic-matchup-previews-strip-faab
